name: Validate & Package Agent Submission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-pack:
    name: Validate Schema & Build submission.zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate submission directory
        run: |
          python scripts/validate.py

      - name: Package submission.zip
        run: |
          python scripts/package.py

      - name: Upload submission.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: submission-zip
          path: dist/submission.zip
          retention-days: 14
